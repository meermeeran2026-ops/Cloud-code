name: MeterDown APK

on:
  push:
    paths:
      - 'meterdown/**'
      - '.github/workflows/meterdown-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meterdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk MeterDown.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeterDown-apk
          path: meterdown/MeterDown.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: meterdown-build-${{ github.run_number }}
          name: MeterDown build ${{ github.run_number }}
          body: Test build of the MeterDown app skeleton (UI only, sample data).
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: meterdown/MeterDown.apk
